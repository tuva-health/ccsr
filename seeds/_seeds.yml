version: 2

seeds:
  - name: dxccsr_v2027_1_cleaned_map
    description: AHRQ DXCCSR v2027.1 diagnosis mappings, normalized by the
      versioned Tuva data-assets preparation recipe.
      For each ICD-10-CM code, the table contains up to six CCSR category codes and a default CCSR category code.
    config:
      column_types:
        icd_10_cm_code: &string_type |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        icd_10_cm_code_description: &description_type |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(1000) {%- endif -%}
        default_ccsr_category_ip: *string_type
        default_ccsr_category_description_ip: *description_type
        default_ccsr_category_op: *string_type
        default_ccsr_category_description_op: *description_type
        ccsr_category_1: *string_type
        ccsr_category_1_description: *description_type
        ccsr_category_2: *string_type
        ccsr_category_2_description: *description_type
        ccsr_category_3: *string_type
        ccsr_category_3_description: *description_type
        ccsr_category_4: *string_type
        ccsr_category_4_description: *description_type
        ccsr_category_5: *string_type
        ccsr_category_5_description: *description_type
        ccsr_category_6: *string_type
        ccsr_category_6_description: *description_type
    columns:
      - name: icd_10_cm_code
        data_tests: [not_null, unique]
  - name: prccsr_v2027_1_cleaned_map
    description: AHRQ PRCCSR v2027.1 procedure mappings. AHRQ's coarse APPROACH
      classification is omitted; public procedure approach remains the CMS
      ICD-10-PCS ontology attribute.
    config:
      column_types:
        icd_10_pcs: *string_type
        icd_10_pcs_description: *description_type
        prccsr: *string_type
        prccsr_description: *description_type
        clinical_domain: *string_type
    columns:
      - name: icd_10_pcs
        data_tests: [not_null, unique]
      - name: prccsr
        data_tests: [not_null]
  - name: dxccsr_v2027_1_body_systems
    description: |
      A table containing descriptions of the top level categories used in the CCSR condition mapper.
      Derived from the Naming_Conventions sheet in the AHRQ DXCCSR v2027.1 reference workbook.
    config:
      column_types:
        body_system: *string_type
        ccsr_parent_category: *string_type
        parent_category_description: *description_type
    columns:
      - name: ccsr_parent_category
        data_tests: [not_null, unique]
