version: 2

unit_tests:
  - name: test_long_condition_category_retains_all_mappings_without_setting
    description: >-
      AHRQ v2027.1 maps I110 to CIR008 and CIR019, and Z2989 to FAC005 even
      though Z2989 is not an acceptable inpatient principal diagnosis. Retain
      these mappings at every source rank, including null, and keep unmapped
      ICD-10-CM codes visible without assigning a category.
    model: ccsr__long_condition_category
    given:
      - input: ref('core__condition')
        format: sql
        rows: |
          select
              'rank-1' as encounter_id
            , 'claim-1' as claim_id
            , 'person-1' as person_id
            , 'I110' as normalized_code
            , 1 as condition_rank
            , 'icd-10-cm' as code_system
            , 'source-a' as data_source
          union all
          select 'rank-2', 'claim-2', 'person-1', 'I110', 2, 'icd-10-cm', 'source-a'
          union all
          select 'unranked', null, 'person-1', 'I110', null, 'icd-10-cm', 'source-a'
          union all
          select 'op-default-only', 'claim-3', 'person-1', 'Z2989', 1, 'icd-10-cm', 'source-a'
          union all
          select 'unmapped', null, 'person-1', 'UNMAPPED', null, 'icd-10-cm', 'source-a'
          union all
          select 'other-code-system', null, 'person-1', 'I110', 1, 'snomed-ct', 'source-a'
      - input: ref('ccsr__dx_vertical_pivot')
        rows:
          - code: I110
            code_description: Hypertensive heart disease with heart failure
            ccsr_parent_category: CIR
            ccsr_category: CIR008
            ccsr_category_description: Hypertension with complications and secondary hypertension
            ccsr_category_rank: 1
            is_ip_default_category: false
            is_op_default_category: false
          - code: I110
            code_description: Hypertensive heart disease with heart failure
            ccsr_parent_category: CIR
            ccsr_category: CIR019
            ccsr_category_description: Heart failure
            ccsr_category_rank: 2
            is_ip_default_category: true
            is_op_default_category: true
          - code: Z2989
            code_description: Encounter for other specified prophylactic measures
            ccsr_parent_category: FAC
            ccsr_category: FAC005
            ccsr_category_description: Encounter for prophylactic measures (excludes immunization)
            ccsr_category_rank: 1
            is_ip_default_category: false
            is_op_default_category: true
      - input: ref('dxccsr_v2027_1_body_systems')
        format: sql
        rows: |
          select
              'CIR' as ccsr_parent_category
            , 'Diseases of the circulatory system' as body_system
            , 'Diseases of the circulatory system' as parent_category_description
          union all
          select 'FAC', 'Factors influencing health status and contact with health services',
              'Factors influencing health status and contact with health services'
    expect:
      rows:
        - {encounter_id: rank-1, code: I110, diagnosis_rank: 1, ccsr_category: CIR008, is_ip_default_category: false, is_op_default_category: false}
        - {encounter_id: rank-1, code: I110, diagnosis_rank: 1, ccsr_category: CIR019, is_ip_default_category: true, is_op_default_category: true}
        - {encounter_id: rank-2, code: I110, diagnosis_rank: 2, ccsr_category: CIR008, is_ip_default_category: false, is_op_default_category: false}
        - {encounter_id: rank-2, code: I110, diagnosis_rank: 2, ccsr_category: CIR019, is_ip_default_category: true, is_op_default_category: true}
        - {encounter_id: unranked, code: I110, diagnosis_rank: null, ccsr_category: CIR008, is_ip_default_category: false, is_op_default_category: false}
        - {encounter_id: unranked, code: I110, diagnosis_rank: null, ccsr_category: CIR019, is_ip_default_category: true, is_op_default_category: true}
        - {encounter_id: op-default-only, code: Z2989, diagnosis_rank: 1, ccsr_category: FAC005, is_ip_default_category: false, is_op_default_category: true}
        - {encounter_id: unmapped, code: UNMAPPED, diagnosis_rank: null, ccsr_category: null, is_ip_default_category: null, is_op_default_category: null}

  - name: test_long_condition_category_preserves_data_source
    description: >
      Reused condition identifiers in different sources remain independently
      attributable after diagnosis-category mapping.
    model: ccsr__long_condition_category
    given:
      - input: ref('core__condition')
        format: sql
        rows: |
          select
              'encounter-1' as encounter_id
            , 'claim-1' as claim_id
            , 'person-1' as person_id
            , 'A000' as normalized_code
            , 1 as condition_rank
            , 'icd-10-cm' as code_system
            , 'source-a' as data_source
          union all
          select
              'encounter-1', 'claim-1', 'person-1', 'A000', 1,
              'icd-10-cm', 'source-b'
      - input: ref('ccsr__dx_vertical_pivot')
        format: sql
        rows: |
          select
              'A000' as code
            , 'Test diagnosis' as code_description
            , 'INF' as ccsr_parent_category
            , 'INF001' as ccsr_category
            , 'Test category' as ccsr_category_description
            , 1 as ccsr_category_rank
            , 1 as is_ip_default_category
            , 1 as is_op_default_category
      - input: ref('dxccsr_v2027_1_body_systems')
        format: sql
        rows: |
          select
              'INF' as ccsr_parent_category
            , 'Infections' as body_system
            , 'Test parent category' as parent_category_description
    expect:
      rows:
        - encounter_id: encounter-1
          claim_id: claim-1
          person_id: person-1
          data_source: source-a
          code: A000
          ccsr_category: INF001
        - encounter_id: encounter-1
          claim_id: claim-1
          person_id: person-1
          data_source: source-b
          code: A000
          ccsr_category: INF001

  - name: test_long_procedure_category_preserves_source_record_identity
    description: >
      Procedure records sharing encounter, person, and code values remain
      distinct by procedure, claim, and data source after category mapping.
    model: ccsr__long_procedure_category
    given:
      - input: ref('core__procedure')
        format: sql
        rows: |
          select
              'procedure-1' as procedure_id
            , 'encounter-1' as encounter_id
            , 'claim-1' as claim_id
            , 'person-1' as person_id
            , '0016070' as normalized_code
            , 'icd-10-pcs' as code_system
            , 'source-a' as data_source
          union all
          select
              'procedure-2', 'encounter-1', 'claim-2', 'person-1',
              '0016070', 'icd-10-pcs', 'source-a'
          union all
          select
              'procedure-1', 'encounter-1', 'claim-1', 'person-1',
              '0016070', 'icd-10-pcs', 'source-b'
      - input: ref('ccsr__procedure_category_map')
        format: sql
        rows: |
          select
              '0016070' as code
            , 'Test procedure' as code_description
            , 'CAR' as ccsr_parent_category
            , 'CAR001' as ccsr_category
            , 'Test category' as ccsr_category_description
            , 'Cardiovascular' as clinical_domain
            , 'Medical and Surgical' as procedure_section
            , 'Bypass' as operation
            , 'Open' as approach
            , 'No Device' as device
            , 'No Qualifier' as qualifier
    expect:
      rows:
        - procedure_id: procedure-1
          encounter_id: encounter-1
          claim_id: claim-1
          person_id: person-1
          data_source: source-a
          code: '0016070'
          ccsr_category: CAR001
        - procedure_id: procedure-2
          encounter_id: encounter-1
          claim_id: claim-2
          person_id: person-1
          data_source: source-a
          code: '0016070'
          ccsr_category: CAR001
        - procedure_id: procedure-1
          encounter_id: encounter-1
          claim_id: claim-1
          person_id: person-1
          data_source: source-b
          code: '0016070'
          ccsr_category: CAR001

  - name: test_wide_procedure_category_keeps_one_horizontal_row_per_encounter
    description: >-
      Multiple procedures on one encounter contribute category indicators to
      one source-scoped horizontal record instead of producing sparse rows.
    model: ccsr__wide_procedure_category
    overrides:
      vars:
        _ccsr_procedure_categories_override: [CAR001, DIG001]
    given:
      - input: ref('ccsr__long_procedure_category')
        format: sql
        rows: |
          select
              'procedure-1' as procedure_id
            , 'encounter-1' as encounter_id
            , 'claim-1' as claim_id
            , 'person-1' as person_id
            , 'source-a' as data_source
            , 'CAR001' as ccsr_category
          union all
          select
              'procedure-2', 'encounter-1', 'claim-2', 'person-1', 'source-a', 'DIG001'
          union all
          select
              'procedure-1', 'encounter-1', 'claim-1', 'person-1', 'source-b', 'CAR001'
    expect:
      rows:
        - {encounter_id: encounter-1, person_id: person-1, data_source: source-a, prccsr_car001: 1, prccsr_dig001: 1}
        - {encounter_id: encounter-1, person_id: person-1, data_source: source-b, prccsr_car001: 1, prccsr_dig001: 0}

  - name: test_procedure_category_map_restores_icd_10_pcs_attributes
    description: >
      The category map retains the ICD-10-PCS attributes required by the
      public procedure summary.
    model: ccsr__procedure_category_map
    given:
      - input: ref('prccsr_v2027_1_cleaned_map')
        format: sql
        rows: |
          select
              '0016070' as icd_10_pcs
            , 'Test procedure' as icd_10_pcs_description
            , 'CAR001' as prccsr
            , 'Test category' as prccsr_description
            , 'Cardiovascular' as clinical_domain
          from (select 1 as _tuva_fixture_row) as _tuva_fixture_row
      - input: ref('terminology__icd10_pcs_cms_ontology')
        format: sql
        rows: |
          select
              '0016070' as icd10pcs_code
            , 'Medical and Surgical' as section
            , 'Bypass' as operation
            , 'Open' as approach
            , 'No Device' as device
            , 'No Qualifier' as qualifier
          from (select 1 as _tuva_fixture_row) as _tuva_fixture_row
    expect:
      rows:
        - code: '0016070'
          ccsr_category: CAR001
          procedure_section: Medical and Surgical
          operation: Bypass
          approach: Open
          device: No Device
          qualifier: No Qualifier

  - name: test_procedure_summary_is_source_scoped
    description: >
      Reused category and operation values calculate independent claim-linked
      procedure totals and approach rates in each source, preserving the
      retained behavior that excludes clinical procedures with no claim ID.
    model: ccsr__procedure_summary
    given:
      - input: ref('ccsr__long_procedure_category')
        format: sql
        rows: |
          select
              'source-a' as data_source
            , 'claim-1' as claim_id
            , 'CAR001' as ccsr_category
            , 'Test category' as ccsr_category_description
            , 'Bypass' as operation
            , 'Open' as approach
          union all
          select 'source-a', 'claim-2', 'CAR001', 'Test category', 'Bypass', 'Percutaneous'
          union all
          select 'source-a', null, 'CAR001', 'Test category', 'Bypass', 'Open'
          union all
          select 'source-b', 'claim-3', 'CAR001', 'Test category', 'Bypass', 'Open'
      - input: ref('ccsr__procedure_category_map')
        format: sql
        rows: |
          select
              'CAR001' as ccsr_category
            , 'Test category' as ccsr_category_description
    expect:
      rows:
        - data_source: source-a
          ccsr_category: CAR001
          operation: Bypass
          approach: Open
          n_occurrences_with_approach: 1
          n_total_occurrences: 2
          approach_rate: 50.0
        - data_source: source-a
          ccsr_category: CAR001
          operation: Bypass
          approach: Percutaneous
          n_occurrences_with_approach: 1
          n_total_occurrences: 2
          approach_rate: 50.0
        - data_source: source-b
          ccsr_category: CAR001
          operation: Bypass
          approach: Open
          n_occurrences_with_approach: 1
          n_total_occurrences: 1
          approach_rate: 100.0

  - name: test_procedure_summary_combines_description_variants
    description: >
      Description variants for one category do not split its source-scoped
      procedure counts or rates. The category map supplies one stable label.
    model: ccsr__procedure_summary
    given:
      - input: ref('ccsr__long_procedure_category')
        format: sql
        rows: |
          select
              'source-a' as data_source
            , 'claim-1' as claim_id
            , 'CAR001' as ccsr_category
            , 'Alpha category' as ccsr_category_description
            , 'Bypass' as operation
            , 'Open' as approach
          union all
          select 'source-a', 'claim-2', 'CAR001', 'Zulu category', 'Bypass', 'Open'
      - input: ref('ccsr__procedure_category_map')
        format: sql
        rows: |
          select
              'CAR001' as ccsr_category
            , 'Alpha category' as ccsr_category_description
          union all
          select 'CAR001', 'Zulu category'
    expect:
      rows:
        - data_source: source-a
          ccsr_category: CAR001
          ccsr_category_description: Alpha category
          operation: Bypass
          approach: Open
          n_occurrences_with_approach: 2
          n_total_occurrences: 2
          approach_rate: 100.0
