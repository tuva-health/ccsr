version: 2

models:

### Intermediate

  - name: ccsr__dx_vertical_pivot
    config:
      schema: &ccsr_schema |
        {%- if var('tuva_schema_prefix', none) is not none -%}{{ var('tuva_schema_prefix') }}_ccsr
        {%- else -%}ccsr{%- endif -%}
      tags: ccsr
      materialized: table
    description: |
      This is an intermediate model that pivots the DXCCSR's wide-format mapping CSV
      into a long format table. While the seed uses 6 columns to represent the 6 CCSR codes that
      may be present, this generates one row for each CCSR category per ICD code, so up to
      6 rows per code. 

      This model includes details and descriptions of the CCSR parent category and body systems that are inherited by the final models.

      This model may also be useful in looking up CCSR condition category, body system, and parent category information.
    columns:
      - name: code
        description: The ICD-10-CM code
      - name: code_description
        description: The description of the ICD-10-CM code included in the seed file.
      - name: ccsr_category
        description: "A CCSR category for the ICD-10-CM code. One ICD-10-CM code may have up
          6 CCSR categories associated, ordinally ranked by the ccsr_category_rank.
          The not_null test will fail on this dimension if a record has a `code` that isn't
          referenced in the CCSR seed file."
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: ccsr_category_rank
        description: "The ordinal rank of a given CCSR category mapped to an ICD-10-CM code. The
          CCSR seed CSV has the order of categories assigned to each ICD-10-CM code."
      - name: ccsr_category_description
        description: The human readable description of the `ccsr_category`.
      - name: ccsr_parent_category
        description: The CCSR parent category - the three letter prefix for each alphanumeric category.
      - name: is_ip_default_category
        data_type: boolean
        description: >-
          Whether AHRQ designates this category as the default for this code when used
          as an inpatient principal diagnosis. This is mapping metadata, not the
          observed care setting or diagnosis role. It does not filter category assignments.
      - name: is_op_default_category
        data_type: boolean
        description: >-
          Whether AHRQ designates this category as the default for this code when used
          as an outpatient first-listed diagnosis. This is mapping metadata, not the
          observed care setting or diagnosis role. It does not filter category assignments.
      - name: _model_run_time
        description: The time at with the model was materialized. Generated by `dbt_utils.pretty_time` as the local time of the `dbt run` environment.

  - name: ccsr__procedure_category_map
    config:
      schema: *ccsr_schema
      tags: ccsr
      materialized: table
    description: This is an intermediate model that renames some PRCCSR columns to align with other TUVA
      models as well as the `ccsr__dx_vertical_pivot` model.
    columns:
      - name: code
        description: The ICD-10-PCS code
      - name: code_description
        description: The description of the ICD-10-PCS code included in the seed file.
      - name: ccsr_category
        description: The CCSR category to which the ICD-10 code is mapped.
      - name: ccsr_category_description
        description: A description of the CCSR category.
      - name: clinical_domain
        description: The clinical domain to which the CCSR code belongs. Note that the condition models don't have this column, but
          the `body_system` is a conceptually related column in the condition tables.
      - name: ccsr_parent_category
        description: The CCSR parent category - the three letter prefix for each alphanumeric category.
      - name: procedure_section
        description: The broad ICD-10-PCS section associated with the procedure code.
      - name: operation
        description: The ICD-10-PCS root operation associated with the procedure code.
      - name: approach
        description: The ICD-10-PCS approach associated with the procedure code.
      - name: device
        description: The ICD-10-PCS device associated with the procedure code.
      - name: qualifier
        description: The ICD-10-PCS qualifier associated with the procedure code.
      - name: _model_run_time
        description: The time at with the model was materialized. Generated by `dbt_utils.pretty_time` as the local time of the `dbt run` environment.

### Final

  - name: ccsr__long_condition_category
    config:
      schema: *ccsr_schema
      tags: ccsr
      materialized: table
    description: >-
      Maps each Core condition with a non-null normalized ICD-10-CM code to all of its
      AHRQ CCSR categories, regardless of diagnosis rank or care setting. A code may
      map to up to six categories. Unmapped codes remain with null category fields.
      The model uses the long format of AHRQ's vertical output; it does not assign
      a single default category to a principal or first-listed diagnosis.
    columns:
      - name: encounter_id
        description: Unique identifier for each the encounter.
      - name: claim_id
        description: Unique identifier for each claim.
      - name: person_id
        description: Unique identifier for each patient.
      - name: data_source
        description: Source system associated with the condition record.
        data_tests:
          - not_null
      - name: code
        description: "The ICD-10-CM code for the diagnosis."
      - name: code_description
        description: "The ICD-10-CM code description provided in the CCSR CSV seed file."
      - name: diagnosis_rank
        description: >-
          The condition_rank supplied by Core. For claims this is the diagnosis
          position; for clinical data it is the source-provided rank. A value of 1
          does not establish that the condition is the encounter's principal diagnosis.
        data_type: integer
      - name: body_system
        description: The body system to which each parent category belongs. The 22 body systems generally follow the structure of the ICD-10-CM diagnosis chapters.
          Note that the procedure tables don't have this column, but a conceptually related field in procedure models is `clinical_domain`.
      - name: ccsr_parent_category
        description: The parent category code for each CCSR category. In practice, this is the three letter prefix to the category code.
      - name: parent_category_description
        description: A description of the parent category.
      - name: ccsr_category
        description: >-
          CCSR category assigned to the ICD-10-CM diagnosis. A code can map to up
          to six categories, represented as separate rows. This field is null
          when the normalized diagnosis code has no CCSR mapping.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: ccsr_category_description
        description: "The description of the CCSR category as provided in the CCSR seed file."
      - name: ccsr_category_rank
        description: "The ordinal rank of a given CCSR category mapped to an ICD-10-CM code. The
          CCSR seed CSV has the order of categories assigned to each ICD-10-CM code."
      - name: is_ip_default_category
        data_type: boolean
        description: >-
          Whether AHRQ designates this category as the default for this code when used
          as an inpatient principal diagnosis. This is mapping metadata, not the
          observed care setting or diagnosis role. It does not filter category assignments.
      - name: is_op_default_category
        data_type: boolean
        description: >-
          Whether AHRQ designates this category as the default for this code when used
          as an outpatient first-listed diagnosis. This is mapping metadata, not the
          observed care setting or diagnosis role. It does not filter category assignments.
      - name: dxccsr_version
        description: The version number of the CCSR program from which the dbt model was derived.
      - name: _model_run_time
        description: The time at with the model was materialized. Generated by `dbt_utils.pretty_time` as the local time of the `dbt run` environment.


  - name: ccsr__wide_condition_category
    config:
      schema: *ccsr_schema
      tags: ccsr
      materialized: table
      enabled: "{{var('wide_condition_enabled', True)}}"
    description: |
      One row per encounter_id, claim_id, person_id, and data_source, with a column
      for each CCSR diagnosis category. Values use the diagnosis ranks supplied by Core:
        * 0 - No diagnosis with rank 1 or greater maps to the category.
        * 1 - Only rank-1 diagnoses map to the category.
        * 2 - At least one rank-1 and one non-rank-1 or unranked diagnosis map to the category.
        * 3 - At least one diagnosis with rank greater than 1, and no rank-1 diagnosis, maps to the category.

      These indicators describe source diagnosis order, not a verified encounter-level
      principal diagnosis. A category supported only by unranked diagnoses has a value
      of 0; use the long output to retain all mapped diagnoses regardless of rank.
      If a category has both rank-1 and unranked diagnoses, the current indicator is 2.
      Category descriptions are available in ccsr__dx_vertical_pivot.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - encounter_id
              - claim_id
              - person_id
              - data_source
    columns:
      - name: encounter_id
        description: Unique identifier for an encounter.
      - name: claim_id
        description: Unique claim_id for each claim.
      - name: person_id
        description: Unique identifier for each patient.
      - name: data_source
        description: Source system included in the condition output grain.
        data_tests:
          - not_null
      - name: dxccsr_version
        description: The version number of the CCSR program from which the dbt model was derived.
      - name: _model_run_time
        description: The time at with the model was materialized. Generated by `dbt_utils.pretty_time` as the local time of the `dbt run` environment.


  - name: ccsr__long_procedure_category
    description: This model contains a mapping of individual condition ICD-10-PCS procedure codes to the
      CCSR's clinically meaningful procedure categories. Each row represents a mapping of an ICD-10 code
      to a CCSR category. The model is equivalent to the CCSR's Output Option 1 - Vertical File Output.
    config:
      schema: *ccsr_schema
      tags: ccsr
      materialized: table
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - procedure_id
              - data_source
              - ccsr_category
    columns:
      - name: procedure_id
        description: Unique identifier for the source procedure record.
      - name: encounter_id
        description: The encounter_id for the encounter where this procedure was performed.
        data_tests:
            - not_null:
                config:
                  severity: warn
      - name: person_id
        description: Unique identifier for each patient.
      - name: claim_id
        description: Unique identifier for the associated claim when available.
      - name: data_source
        description: Source system included in the procedure output grain.
        data_tests:
          - not_null
      - name: code
        description: The ICD-10-PCS code for the procedure.
      - name: code_description
        description: "The ICD-10-PCS code description provided in the CCSR CSV seed file."
      - name: ccsr_parent_category
        description: The parent category code for each CCSR category. In practice, this is the three letter prefix to the category code.
      - name: clinical_domain
        description: The ICD-10-PCS Clinical Domain that the CCSR parent category belongs to. Note that the condition models don't have this column, but
          the `body_system` is a conceptually related column in the condition tables.
      - name: procedure_section
        description: The broad ICD-10-PCS section associated with the procedure code.
      - name: operation
        description: The ICD-10-PCS root operation associated with the procedure code.
      - name: approach
        description: The ICD-10-PCS approach associated with the procedure code.
      - name: device
        description: The ICD-10-PCS device associated with the procedure code.
      - name: qualifier
        description: The ICD-10-PCS qualifier associated with the procedure code.
      - name: ccsr_category_description
        description: A description of the clinical domain.
      - name: ccsr_category
        description: The CCSR category mapped to the ICD-10-PCS code.
        data_tests:
            - not_null:
                config:
                  severity: warn
      - name: prccsr_version
        description: The version number of the CCSR program from which the dbt model was derived.
      - name: _model_run_time
        description: The time at with the model was materialized. Generated by `dbt_utils.pretty_time` as the local time of the `dbt run` environment.


  - name: ccsr__procedure_summary
    config:
      schema: *ccsr_schema
      tags: ccsr
      materialized: table
    description: >
      Source-scoped claim-linked procedure volume patterns by CCSR category,
      ICD-10-PCS root operation, and approach. Procedures without a claim ID
      are excluded from the occurrence counts.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - data_source
              - ccsr_category
              - operation
              - approach
    columns:
      - name: data_source
        description: Source system used to scope the procedure volume and rate.
        data_tests:
          - not_null
      - name: ccsr_category
        description: The CCSR category associated with the procedure.
        data_tests:
          - not_null
      - name: ccsr_category_description
        description: The human-readable CCSR category description.
      - name: operation
        description: The ICD-10-PCS root operation associated with the procedure.
      - name: approach
        description: The ICD-10-PCS approach associated with the procedure.
      - name: n_occurrences_with_approach
        description: Number of source-scoped claim-linked procedures for the category, operation, and approach.
      - name: n_total_occurrences
        description: Total source-scoped claim-linked procedures for the category and operation.
      - name: approach_rate
        description: Percentage of claim-linked category and operation procedures performed with the approach.
      - name: _model_run_time
        description: The time at which the model was materialized.


  - name: ccsr__wide_procedure_category
    config:
      schema: *ccsr_schema
      tags: ccsr
      materialized: table
      enabled: "{{var('wide_procedure_enabled', True)}}"
    description: >-
      Groups procedures by encounter_id, person_id, and data_source, with a column
      for each CCSR procedure category. Each category column contains 1 when at
      least one ICD-10-PCS procedure in the group maps to that category, and 0
      otherwise. Category descriptions are available in ccsr__procedure_category_map.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - encounter_id
              - data_source
    columns:
      - name: encounter_id
        description: The encounter_id for the encounter where this procedure was performed.
        data_tests:
            - not_null:
                config:
                  severity: warn
      - name: person_id
        description: Unique identifier for each patient.
      - name: data_source
        description: Source system included in the procedure output grain.
        data_tests:
          - not_null
      - name: prccsr_version
        description: The version number of the CCSR program from which the dbt model was derived.
      - name: _model_run_time
        description: The time at with the model was materialized. Generated by `dbt_utils.pretty_time` as the local time of the `dbt run` environment.
